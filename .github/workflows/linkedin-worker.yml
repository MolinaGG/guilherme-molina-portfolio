name: LinkedIn worker
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'linkedin-worker/*.py'
      - 'linkedin-worker/tests/**'
      - 'linkedin-worker/requirements.txt'
      - '.github/workflows/linkedin-worker.yml'
permissions:
  contents: read
concurrency:
  group: linkedin-worker-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: linkedin-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
  publish:
    needs: validate
    if: vars.LINKEDIN_WORKER_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: linkedin-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install rendering fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - name: Reconcile, research and replenish Buffer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FULL_HISTORY: ${{ vars.BUFFER_FULL_HISTORY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          ENABLE_GENERATION: ${{ vars.ENABLE_LINKEDIN_GENERATION || 'true' }}
          MAX_MONTHLY_AI_CALLS: ${{ vars.MAX_MONTHLY_AI_CALLS || '64' }}
        run: python cloud_worker.py --apply
      - name: Failure summary
        if: failure()
        run: |
          echo 'Worker interrompido. Consulte os logs e linkedin-worker/runtime/state.json. Não apague o histórico para reenviar. Confira os secrets e as notificações de Actions.' >> "$GITHUB_STEP_SUMMARY"
